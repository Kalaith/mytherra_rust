[package]
name = "mytherra"
version = "0.1.0"
edition = "2021"

# This package is the macroquad client (GDD 12); the simulation lives in the
# `mytherra-core` member crate, which the client embeds for its offline mode.
[workspace]
members = ["mytherra-core", "mytherra-protocol", "mytherra-persistence", "mytherra-server"]

[dependencies]
mytherra-core = { path = "mytherra-core" }
mytherra-protocol = { path = "mytherra-protocol" }
macroquad = "0.4"
macroquad-toolkit = { path = "../macroquad-toolkit", features = ["net"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Forges a WebHatchery account token (HS256) in the ignored live-server net test
# for account linking (GDD 7.3) — signed with the same JWT_SECRET the server
# verifies against. Test-only; the client never mints tokens itself.
jsonwebtoken = "9"
